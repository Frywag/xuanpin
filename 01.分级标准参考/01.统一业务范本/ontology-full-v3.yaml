meta:
  ontology_id: ONT-FULL-V3
  version: 3.0-draft
  date: '2026-06-11'
  merges:
  - ONT-V1(第一期方案)
  - ONT-V2-EXTENSION(52实体/91关系)
  - US-FBA-MVP(规则16/费率73)
  coverage:
    physical_tables: 575
    domain_classified: 575
    entity_mapped: 410
    fields_dictionary: 11602
    lineage_edges: 8782
    join_edges: 219
  design_principles: 沿用V1七原则+V2三原则
domains:
- domain_id: DOM-AD
  name: 广告域
  name_en: Advertising
  status: 新增
  说明: Amazon Ads(SP为主)+ Temu广告。覆盖投放对象层级、定向体系、报表对象、关键词资产
- domain_id: DOM-CAT
  name: 类目与商品体系域
  name_en: CatalogTaxonomy
  status: 新增
  说明: Amazon BrowseNode 类目树、ProductType Schema、ASIN/Listing/变体家族。修复第一期 ProductCategory 过于简化的缺口
- domain_id: DOM-LOG
  name: 物流执行域
  name_en: LogisticsExecution
  status: 深化
  说明: 第一期只有 Channel/Warehouse/Shipment 三个静态实体;本期补全 PSI 发货执行链路(主计划→子计划→需求单→装箱→票号→货件)与轨迹/补偿
- domain_id: DOM-SUP
  name: 采购供应域
  name_en: SupplyChain
  status: 新增
  说明: 供应商、采购单、质检、不良品。物流执行域的上游,前置成本的发生源头
- domain_id: DOM-PRECOST
  name: 运营前置成本域
  name_en: PreLaunchCost
  status: 新增
  说明: 开品到动销前发生的一切成本:打样、测款、素材、Listing建设、合规、首单备货、广告冷启动。支撑'开一个新品/新品牌要花多少钱'的核心问题
- domain_id: DOM-BRAND
  name: 品牌矩阵域
  name_en: BrandMatrix
  status: 新增
  说明: 品牌、产品线、产品定位、品牌分析、竞品对标。服务白牌→品牌矩阵战略转型
- domain_id: DOM-DATA
  name: 数据资产域
  name_en: DataAsset
  status: 深化
  说明: 第一期 DataRule 的实体化落地:数据资产、字段、血缘边,对齐数据中台元数据系统
- domain_id: DOM-CORE
  name: 核心主数据域
  说明: V1继承:国家/平台/主体/服务商
- domain_id: DOM-ORD
  name: 订单销售域
  说明: 新建:订单/订单行/履约/退货/业务报告;26张表
- domain_id: DOM-FIN
  name: 财务结算域
  说明: 新建:结算/汇率/平台费实际/促销/财务映射;18张表
- domain_id: DOM-INV
  name: 库存仓储域
  说明: 新建+V1深化:FBA快照/调拨/库存记录;36张表
- domain_id: DOM-ORG
  name: 组织用户域
  说明: 新建:店铺/用户;14张表
- domain_id: DOM-MKT
  name: 市场调研域
  说明: 新建:爬虫/选品/类目分析;30张表
- domain_id: DOM-PLT-TEMU
  name: Temu平台特化
  说明: 35张表,特化占位
- domain_id: DOM-PLT-SHEIN
  name: Shein平台特化
  说明: 26张表,特化占位
- domain_id: DOM-PLT-TIKTOK
  name: TikTok平台特化
  说明: 8张表,特化占位
entities_v1_inherited:
- entity_id: CountryRegion
  name: 国家/地区
  domain: DOM-CORE
  说明: V1继承:站点/税务/合规的地理锚点
  key_attributes:
  - country_code
  - name
  - tax_regime
- entity_id: Platform
  name: 销售平台
  domain: DOM-CORE
  说明: V1继承:Amazon/Temu/Shein/TikTok
  key_attributes:
  - platform_code
  - name
- entity_id: LegalEntity
  name: 公司主体
  domain: DOM-CORE
  说明: V1继承:销售/持牌主体;物理表缺失(GAP-01)
  key_attributes:
  - entity_id
  - name
  - country
  - tax_no
- entity_id: Store
  name: 店铺
  domain: DOM-ORG
  说明: V1继承;物理表已证:T_SHOP/dwd_shop(21字段)
  key_attributes:
  - shop_id
  - shop_code
  - platform_code
  - platform_site_code
  - selling_partner_id
- entity_id: SPU
  name: 标准产品单元
  domain: DOM-CAT
  说明: V1继承:款
  key_attributes:
  - spu_id
  - name
  - product_line_id
- entity_id: SKU
  name: 库存量单位
  domain: DOM-CAT
  说明: V1继承;物理表已证:T_ERP_PRODUCT_SKU(豆芽);v2增补材积挡/预估尺寸
  key_attributes:
  - sku_id
  - spu_id
  - color
  - size
  - estimate_us_material_grade
- entity_id: ProductCategory
  name: 内部品类
  domain: DOM-CAT
  说明: V1继承;平台侧由BrowseNode特化(R-CAT-013)
  key_attributes:
  - category_id
  - name
  - parent_id
- entity_id: Warehouse
  name: 仓库
  domain: DOM-INV
  说明: V1继承;v2增补transit中转仓枚举
  key_attributes:
  - warehouse_id
  - name
  - warehouse_type
- entity_id: LogisticsChannel
  name: 物流渠道(配置)
  domain: DOM-LOG
  说明: V1继承;与RealChannel映射
  key_attributes:
  - channel_id
  - name
  - rate_card_ref
- entity_id: ServiceProvider
  name: 服务商
  domain: DOM-CORE
  说明: V1继承;LogisticsProvider为其子类
  key_attributes:
  - provider_id
  - name
  - type
- entity_id: InventoryRecord
  name: 库存记录
  domain: DOM-INV
  说明: V1继承
  key_attributes:
  - sku_id
  - warehouse_id
  - qty
  - snapshot_date
- entity_id: SourceDocument
  name: 溯源文件(L0)
  domain: DOM-DATA
  说明: V1继承:报价单/合同/官方页归档
  key_attributes:
  - source_id
  - file_name
  - source_party
  - version
- entity_id: Rule
  name: 规则(L3基类)
  domain: DOM-DATA
  说明: V1继承:统一语义模型(适用条件/计算/生命周期/溯源/automation)
  key_attributes:
  - rule_id
  - rule_category
  - applicability
  - calculation
  - lifecycle
  - provenance
- entity_id: Case
  name: 案例(L4)
  domain: DOM-DATA
  说明: V1继承:验算案例
  key_attributes:
  - case_id
  - scenario
  - related_rules
entities_v2:
- entity_id: AdProfile
  name: 广告档案
  domain: DOM-AD
  说明: 广告账户在某市场的投放主体,Amazon Ads API 的顶层对象;一个店铺×站点对应一个 Profile
  key_attributes:
  - profile_id
  - marketplace_id
  - store_id
  - currency_code
  - timezone
  - account_type
  source_evidence:
  - T_AMAZON_ADVERTISING_PROFILE
  - dwd_amazon_ad_profile
- entity_id: AdPortfolio
  name: 广告组合
  domain: DOM-AD
  说明: Campaign 的业务分组容器,可设组合级预算;品牌矩阵下建议按 Brand×ProductLine 建组合
  key_attributes:
  - portfolio_id
  - portfolio_name
  - budget_amount
  - budget_policy
  - state
  source_evidence:
  - T_AMAZON_ADVERTISING_PORTFOLIO
  - dwd_amazon_ad_portfolio
- entity_id: AdCampaign
  name: 广告活动
  domain: DOM-AD
  说明: 投放的最小预算与策略单元
  key_attributes:
  - campaign_id
  - campaign_name
  - ad_product_type
  - targeting_type
  - daily_budget
  - bidding_strategy
  - placement_adjustment
  - state
  - start_date / end_date
  source_evidence:
  - T_AMAZON_ADVERTISING_CAMPAIGN
  - T_AMAZON_ADVERTISING_CAMPAIGN_EXTEND
  - dwd_amazon_ad_campaign
  - dwd_amazon_ad_campaign_adjustments
- entity_id: AdGroup
  name: 广告组
  domain: DOM-AD
  说明: Campaign 下的定向与出价分组;同组共享默认竞价
  key_attributes:
  - ad_group_id
  - ad_group_name
  - default_bid
  - state
  source_evidence:
  - T_AMAZON_ADVERTISING_GROUP
  - dwd_amazon_ad_group
- entity_id: ProductAd
  name: 商品广告
  domain: DOM-AD
  说明: 被推广的具体商品(ASIN/SKU)在广告组中的投放实例
  key_attributes:
  - ad_id
  - asin
  - seller_sku
  - state
  source_evidence:
  - T_AMAZON_ADVERTISING_PRODUCT
  - dwd_amazon_ad_product
- entity_id: AdKeyword
  name: 广告关键词
  domain: DOM-AD
  说明: 手动关键词定向单元;含正向关键词。匹配类型决定流量宽窄
  key_attributes:
  - keyword_id
  - keyword_text
  - match_type
  - bid
  - state
  - is_negative: false
  source_evidence:
  - T_AMAZON_ADVERTISING_KEYWORD
  - dwd_amazon_ad_keyword
  - AD_AUTO_KEYWORD_BID_TB
- entity_id: NegativeKeyword
  name: 否定关键词
  domain: DOM-AD
  说明: 排除流量的关键词;可挂活动级或广告组级
  key_attributes:
  - keyword_id
  - keyword_text
  - match_type
  - level
  source_evidence:
  - T_AMAZON_ADVERTISING_KEYWORD(is_negative)
- entity_id: AdTarget
  name: 广告投放目标(商品/类目定向)
  domain: DOM-AD
  说明: 非关键词定向单元:商品定向(ASIN)、类目定向(BrowseNode/Category + 细化条件)、自动定向的四类匹配子策略
  key_attributes:
  - target_id
  - expression_type
  - auto_clause
  - refinement
  - bid
  - state
  - is_negative
  source_evidence:
  - T_AMAZON_ADVERTISING_TARGET
  - dwd_amazon_ad_target
- entity_id: SearchTerm
  name: 客户搜索词
  domain: DOM-AD
  说明: 买家实际输入并触发了广告的搜索词;关键词收割与否定的原料。与 AdKeyword 是'实际流量 vs 定向意图'的关系
  key_attributes:
  - search_term_text
  - triggered_by
  - first_seen_date
  source_evidence:
  - T_AZ_ADVERT_SEARCH_TERM_REPORT
  - dwd_amazon_ad_search_term_report
- entity_id: AdPlacement
  name: 广告展示位
  domain: DOM-AD
  说明: 广告实际展示位置维度
  key_attributes:
  - placement_type
  source_evidence:
  - T_AZ_ADVERT_PLACEMENT_REPORT
  - dwd_amazon_ad_placement_report
- entity_id: AdAudience
  name: 广告受众
  domain: DOM-AD
  说明: SD/再营销场景的受众分群(浏览定向/购买定向等)
  key_attributes:
  - audience_id
  - audience_type
  source_evidence:
  - T_AZ_ADVERT_AUDIENCE_REPORT
  - dwd_amazon_ad_audience_report
- entity_id: AdPerformanceRecord
  name: 广告绩效记录
  domain: DOM-AD
  说明: 按 维度对象×日期 的投放绩效事实;维度对象可为 Campaign/AdGroup/Keyword/Target/SearchTerm/Placement/Audience/ProductAd/ASIN(对应你们 9 张报告表)。本体层将其统一为一个事实实体
    + dimension_type 区分
  key_attributes:
  - record_date
  - dimension_type
  - dimension_id
  - impressions / clicks / spend
  - attributed_sales / attributed_orders / attributed_units
  source_evidence:
  - T_AZ_ADVERT_*_REPORT(9张)
  - dwd_amazon_ad_*_report(9张)
  - T_TEMU_AD_PLATFORM_REPORT_WEEKLY/MONTHLY
- entity_id: AdInvoice
  name: 广告发票
  domain: DOM-AD
  说明: 广告费用的财务结算凭证;广告域与财务域(第一期 AdvertisingFee 规则)的对账锚点
  key_attributes:
  - invoice_id
  - invoice_period
  - amount / currency
  - profile_id
  source_evidence:
  - T_AMAZON_AD_INVOICE
  - dwd_amazon_ad_invoice
- entity_id: KeywordAsset
  name: 关键词资产
  domain: DOM-AD
  说明: 脱离单次投放的关键词知识库:精准词库、反查词库、流量关键词及分组。是公司沉淀的可复用流量资产,品牌词/竞品词/类目词在此分类
  key_attributes:
  - keyword_text
  - library_type
  - keyword_role
  - flow_keyword_group_id
  - site_code
  source_evidence:
  - T_AZ_PRECISE_KEYWORD_LIBRARY
  - T_AZ_ASIN_KEYWORD_LIBRARY
  - T_AZ_LISTING_V2_FLOW_KEYWORD_*
  - T_AZ_LISTING_V2_FLOW_KEYWORD_GROUP(_RELATION)
- entity_id: KeywordRankSnapshot
  name: 关键词排名快照
  domain: DOM-AD
  说明: 爬虫抓取的 ASIN×关键词×站点 的自然位/广告位排名时序;衡量关键词资产的占位效果
  key_attributes:
  - asin / keyword_text / site_code
  - snapshot_date
  - organic_rank
  - sp_rank / sp_slot_type
  source_evidence:
  - T_AZ_CW_{US,UK,DE}_ASIN_KEYWORD_RANK_INFO(±7D)
  - T_AZ_CW_PAGE_KEYWORD_WEB_*_RANK_INFO
  - T_AZ_CW_BRAND_TOP_SEARCH_TERMS_KEYWORD
- entity_id: BrowseNode
  name: Amazon 类目节点
  domain: DOM-CAT
  说明: Amazon 站内类目树节点(树形,叶/枝);第一期 ProductCategory 的 Amazon 特化。注意 PA-API 2026-05 起废弃,数据获取迁移 Creators API,但概念模型不变
  key_attributes:
  - browse_node_id
  - display_name
  - context_free_name
  - is_root / is_leaf
  - marketplace_id
  - sales_rank_scope
  source_evidence:
  - '官方: PA-API GetBrowseNodes(Ancestor/Children)'
  - '类目定向数据: T_AMAZON_ADVERTISING_TARGET'
- entity_id: AmazonProductType
  name: Amazon 产品类型
  domain: DOM-CAT
  说明: SP-API Product Type Definitions 定义的产品类型(如 DRESS/SHIRT),携带 JSON Schema 描述刊登必填属性;女装刊登合规的依据
  key_attributes:
  - product_type_name
  - marketplace_id
  - schema_version
  - required_attributes
  - parentage_level
  source_evidence:
  - '官方: SP-API product-type-definitions-v2020-09-01'
- entity_id: ItemTypeKeyword
  name: 商品类型关键词
  domain: DOM-CAT
  说明: 刊登时声明的 item_type_keyword,决定商品落入哪个 BrowseNode;ProductType 与 BrowseNode 之间的官方推荐桥
  key_attributes:
  - keyword_value
  - recommended_browse_node_id
  source_evidence:
  - '官方: SP-API getDefinitionsProductType 推荐接口'
- entity_id: ASIN
  name: ASIN(Amazon 商品标识)
  domain: DOM-CAT
  说明: Amazon 目录中的商品标识。与第一期 SKU 区分:SKU 是公司内部货品,ASIN 是平台目录对象;一个 ASIN 可被多店铺跟卖。第一期缺失的关键实体
  key_attributes:
  - asin
  - marketplace_id
  - parent_asin
  - brand_name
  source_evidence:
  - T_AZ_* 全系表均以 asin 为键
  - T_WHP_AZ_ASIN_STAR_SCORE_RECORD
- entity_id: Listing
  name: 在线列表(刊登)
  domain: DOM-CAT
  说明: 店铺×ASIN×SellerSKU 的刊登实例,公司运营的最核心对象(你们 248 张表围绕它);承载价格、库存、标签、定位目标
  key_attributes:
  - listing_id
  - store_id / asin / seller_sku / fnsku
  - listing_status
  - price / currency
  - tags
  - custom_group_id
  source_evidence:
  - T_WHP_AZ_EXTEND
  - T_WHP_AMAZON_LISTING_TAG
  - dwd_whp_amazon_listing_cus_group
  - T_AZ_LISTING_* 系列
- entity_id: VariationFamily
  name: 变体家族
  domain: DOM-CAT
  说明: 父 ASIN 与子 ASIN 的变体关系(女装核心:颜色×尺码二维变体)
  key_attributes:
  - parent_asin
  - variation_theme
  - child_count
  source_evidence:
  - T_WHP_AMAZON_PARENT_PATERNITY
  - dwd_whp_amazon_child_paternity
- entity_id: ListingReview
  name: Listing 评价快照
  domain: DOM-CAT
  说明: ASIN 星级/评分/评论数时序;品牌资产健康度的输入
  key_attributes:
  - asin / snapshot_date
  - star_rating / rating_count
  source_evidence:
  - T_WHP_AZ_ASIN_STAR_SCORE_RECORD
- entity_id: MainDeliveryPlan
  name: 发货主计划
  domain: DOM-LOG
  说明: 面向一批 SKU 的总体补货决策(PSI v4 主计划)
  key_attributes:
  - main_plan_id
  - plan_period
  - status
  source_evidence:
  - T_PSI_V4_MAIN_DELIVERY_PLAN(_PRODUCT)(_PRODUCT_DEMAND)
- entity_id: DeliveryPlan
  name: 发货子计划
  domain: DOM-LOG
  说明: 主计划拆解出的可执行发货单元;直发或中转尾程两种履约路径
  key_attributes:
  - plan_id / main_plan_id
  - fulfillment_path
  - shipment_id
  - status
  source_evidence:
  - T_PSI_V4_DELIVERY_PLAN(_PRODUCT)
  - T_PSI_V4_DELIVERY_TAIL_PLAN
- entity_id: DemandBill
  name: 发货需求单
  domain: DOM-LOG
  说明: 发货计划选择的需求来源单据;装箱产品与需求单多对多(一个装箱产品可对应多个 confirmedDemandNo)
  key_attributes:
  - demand_no
  - sku_id / quantity
  - status
  source_evidence:
  - T_PSI_V4_DELIVERY_DEMAND_BILL(_PALLET)(_RECORD)
  - T_PSI_V4_DELIVERY_PLAN_PRE_CREATE_DEMAND_RECORD
- entity_id: PackBox
  name: 装箱(箱)
  domain: DOM-LOG
  说明: 物理装箱单元;含装箱计划产品、安排发货装箱、已发货箱、与物流商箱号的映射
  key_attributes:
  - box_id
  - box_no / carrier_box_no
  - weight / volume
  - box_stage
  source_evidence:
  - T_PSI_V4_PLAN_PACK_FILL_BOX_PRODUCT_INFO
  - T_PSI_V4_LOGISTICS_ARRANGE_PLAN_BOX(_PRODUCT)
  - T_PSI_V4_LOGISTICS_DELIVER_GOOD_BOX
  - T_PSI_V4_DELIVERY_TAIL_BOX(_DEMAND)
  - T_PSI_V4_LOGISTICS_TICKET_ORDER_BOX_RELATIONAL
- entity_id: LogisticsTicket
  name: 物流票号
  domain: DOM-LOG
  说明: 向物流商交运的运单/票号;头程计费与轨迹追踪的主键
  key_attributes:
  - ticket_no
  - channel_id / provider_id
  - total_weight / total_volume / chargeable_weight
  - depart_date / sign_date
  source_evidence:
  - T_PSI_V4_LOGISTICS_DELIVER_GOOD_TICKET
  - T_PSI_V4_TAIL_SALES_SHIPPED_DEMAND_SKU_STOCK_HEAD_TICKET
- entity_id: InboundShipment
  name: Amazon 入库货件
  domain: DOM-LOG
  说明: FBA 货件(shipment_id);血缘显示它是物流域的中枢键,1:N 关联补偿/发货计划/尾程箱/拣货单/履约报告
  key_attributes:
  - shipment_id
  - destination_fc
  - shipment_status
  - logistics_info
  source_evidence:
  - T_AMAZON_INBOUND_SHIPMENT_INFO
  - T_AMAZON_INBOUND_SHIPMENT_LOGISTICS_INFO
- entity_id: LogisticsOrder
  name: 物流订单
  domain: DOM-LOG
  说明: 向物流商下的运输委托订单
  key_attributes:
  - logistics_order_id
  - provider_id / channel_id
  - status
  source_evidence:
  - T_PSI_V4_LOGISTICS_ORDER_INFO
- entity_id: RealChannel
  name: 真实渠道
  domain: DOM-LOG
  说明: 物流商实际执行的渠道;与第一期 LogisticsChannel(报价渠道/配置渠道)区分——配置渠道是签约口径,真实渠道是执行口径,两者映射是渠道偏差分析的基础
  key_attributes:
  - real_channel_id
  - channel_config_id
  - provider_id
  source_evidence:
  - T_PLAN_LOGISTICS_REAL_CHANNEL_INFO
  - T_PLAN_CHANNELS_CONFIG_INFO
- entity_id: LogisticsProvider
  name: 物流商
  domain: DOM-LOG
  说明: 第一期 ServiceProvider 的物流特化;含结算属性
  key_attributes:
  - provider_code / provider_name
  - status
  - default_billing_type
  - default_settle_currency
  source_evidence:
  - T_LOGISTICS_SERVICE_PROVIDER
