rule_taxonomy:
  AdvertisingRule:
    说明: 第四个顶级规则域,与 FinancialRule/LogisticsRule/DataRule 并列;消除第一期 AdvertisingFee 单叶节点的结构性缺口
    children:
      CampaignStructureRule:
      - NamingConvention
      - PortfolioAssignment
      - CampaignSegmentation
      TargetingRule:
      - AutoTargetingClause
      - KeywordMatchPolicy
      - ProductTargetingPolicy
      - CategoryTargetingPolicy
      NegationRule:
      - NegativeKeywordThreshold
      - NegativeProductPolicy
      - CrossCampaignNegation
      BiddingRule:
      - BiddingStrategySelection
      - PlacementAdjustment
      - AutoBidAdjustment
      BudgetRule:
      - DailyBudgetAllocation
      - BudgetCapPolicy
      HarvestingRule:
      - SearchTermPromotion
      - KeywordLibraryGovernance
      AdCostAllocationRule:
      - AsinLevelAllocation
      - BrandLevelAllocation
  PreLaunchCostRule:
    说明: 第五个顶级规则域;回答'开一个新品/新产品线/新品牌,动销前要花多少钱'。每条规则复用第一期 Rule 统一语义模型(applicability/calculation/lifecycle/provenance)
    children:
      ProductDevelopmentCost:
      - SampleCost
      - PatternCost
      - MaterialTestCost
      ContentProductionCost:
      - PhotoShootCost
      - VideoProductionCost
      - ListingCopywritingCost
      ComplianceCost:
      - TextileLabelingCost
      - SafetyTestCost
      - IPClearanceCost
      BrandSetupCost:
      - TrademarkRegistration
      - BrandRegistryCost
      - BrandVICost
      MarketValidationCost:
      - TestAdBudget
      - TestInventoryCost
      - SampleSeedingCost
      CapitalPreOccupation:
      - FirstOrderInventory
      - FirstMilePrepaid
      - PlatformDepositRef
      EntityTaxSetupRef:
      - reference_only: true
  LogisticsRule_additions:
    TransitTailRule:
    - TransitWarehouseFee
    - TailLegRateCard
    - TransitSplitPolicy
    CompensationRule:
    - SLACompensation
    - LossDamageCompensation
    ChargeableWeightRule:
    - VolumetricDivisor
    - WeightRounding
  DataRule_additions:
    EntityMapping_additions:
    - AsinSkuMapping
    - CompetitorMapping
    LineageGovernance:
    - MappingMethodPriority
    - InferredEdgeReview
  BrandGovernanceRule:
    说明: 品牌矩阵治理规则,轻量新增(不展开到第一期同等深度,二期半再深化)
    children:
    - BrandLineAssignment
    - OrientationAssignment
    - CannibalizationCheck
rule_instances_summary:
  precost: 24
  advertising: 21
  logistics_add: 10
  us_fba_mvp_rules: 16
  rate_cards: 73
v1_alignment:
  new_entities_inserted_between_v1:
  - 'Store —sells→ SPU/SKU 之间插入 Listing/ASIN 层: Store→Listing→ASIN; SKU 通过 Listing.fulfills_with 挂接'
  - Shipment(第一期) 细化为 InboundShipment(FBA货件) 并向上补全 MainDeliveryPlan→DeliveryPlan→DemandBill→PackBox→LogisticsTicket 执行链
  - 'ServiceProvider(第一期) 派生子类: LogisticsProvider(本期) / 货品 Supplier 独立为新实体(供应商≠服务商)'
  - ProductCategory(第一期) 保留为内部品类,平台类目由 BrowseNode 特化承载,经 R-CAT-013 对齐
  v1_attribute_amendments:
  - entity: Warehouse
    add: warehouse_type 枚举增补 'transit中转仓'
  - entity: SKU
    add: 'estimate_size(预估尺寸,头程材积计算输入,证据: T_ERP_PRODUCT_SKU_ESTIMATE_SIZE_UPLOAD_RECORD)'
  - entity: Store
    add: ad_profile_id(店铺↔广告档案外键)
  id_mapping_chain_extension:
    广告映射链: Profile → Store → Marketplace; Campaign → Portfolio → (Brand×ProductLine); 报表行 → campaignId/adGroupId/keywordId/targetId
      → 对象树
    商品映射链_修订: Seller SKU → Listing → ASIN → ParentASIN(变体家族) → BrowseNode → 内部ProductCategory; SKU → FNSKU 保留
    品牌聚合链: AdSpend/Sales/毛利 → ASIN → SPU → ProductLine → Brand(品牌矩阵分析主路径)
    成本映射链: POLine成本 + 头程(LogisticsTicket按RateCard) + FeeEstimate + 广告花费 → GrossProfitModel → ASIN毛利
